version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hiring
      POSTGRES_PASSWORD: hiring
      POSTGRES_DB: hiring
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiring"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow_data:/mlflow
    # Artifacts are proxied through the server, so runs don't depend on host paths.
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts "mlflow,mlflow:*,localhost,localhost:*,127.0.0.1:*"

  api:
    build: .
    ports:
      - "${API_PORT:-5000}:5000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://hiring:hiring@postgres:5432/hiring
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - models_data:/app/models
    # Tables are created on startup by init_db (create_all)
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 120 "data5580_hw.app:create_app()"

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://hiring:hiring@postgres:5432/hiring
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - models_data:/app/models
    command: celery -A data5580_hw.worker worker --loglevel=info --concurrency=2

volumes:
  postgres_data:
  models_data:
  mlflow_data:
